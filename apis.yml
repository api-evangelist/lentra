aid: lentra
name: Lentra
description: 'Lentra is a Pune, India based cloud-native digital lending platform for banks and
  non-banking financial companies. Built on a microservices architecture with customisable customer
  journeys, the platform spans loan origination (GoNoGo), loan management (1LMS), data and machine
  learning operations (Lentra MLOps), and data transfer (TransferX), alongside standalone modules
  for MultiBureau credit bureau access, identity and video KYC verification, collateral management,
  document management, co-lending and bank reconciliation. Lentra packages these into pre-built
  retail, business and agriculture lending journeys - home, personal, education, vehicle, consumer
  durable and credit card loans, equipment finance, working capital, supply chain finance and
  agri/KCC lending - delivered SaaS on a per-user or per-transaction basis to institutions including
  HDFC Bank, State Bank of India, IDFC and TVS Credit. The company is an Open Credit Enablement
  Network (OCEN) participant and maintains a public trust center covering SOC 2 Type II, SOC 3,
  ISO 27001:2022, ISO 27017, ISO 27018, ISO 27701, ISO 22301:2019 and CSA STAR. Lentra sells to
  enterprises directly; it does not operate a public self-service developer portal or publish an
  open API reference.'
